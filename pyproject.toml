[project]
name = "spotify-playlist-sorter"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "librosa>=1.0.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "soundfile>=0.14.0",
    "spotipy>=2.26.0",
    "uvicorn>=0.52.4",
    "yt-dlp[default]>=2026.8.19",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
    "ty>=0.0.78",
    "deptry>=0.25.1",
    "httpx2>=2.12.0",
]

[tool.uv]
required-version = ">=0.12.10"

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.src]
include = ["api", "tests"]

[tool.ty.environment]
python-version = "3.13"

[tool.ruff]
line-length = 120
target-version = "py313"

# Exclude files/directories
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "vendor",
]

[tool.ruff.lint]
# Enable all rules by default, then selectively disable
select = ["ALL"]
# Google docstrings and Ruff formatting select one rule from each conflicting pair.
ignore = ["D203", "D212", "COM812", "CPY001"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "PLR2004", "ANN002", "ANN003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-statements = 50

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"
