version: "3"

tasks:
  default:
    desc: List commands
    cmds: [task --list]

  setup:
    desc: Install locked Python and frontend dependencies
    cmds:
      - uv sync --locked
      - pnpm --dir frontend install --frozen-lockfile

  lint:
    desc: Check Python and frontend code without changing files
    cmds:
      - task: lint:check
      - task: lint:format:check
      - task: lint:ty
      - pnpm --dir frontend check

  lint:check:
    cmds: [uv run ruff check app tests]

  lint:fix:
    cmds: [uv run ruff check --fix app tests]

  lint:format:
    cmds: [uv run ruff format app tests]

  lint:format:check:
    cmds: [uv run ruff format --check app tests]

  lint:ty:
    cmds: [uv run ty check]

  fix:
    desc: Apply safe lint fixes and format source
    cmds:
      - task: lint:fix
      - task: lint:format
      - pnpm --dir frontend exec oxlint --type-aware --fix .
      - pnpm --dir frontend format
      - task: lint

  test:
    cmds: [uv run python -m unittest discover -s tests -v]

  build:
    cmds: [pnpm --dir frontend build]

  check:
    desc: Run all checks and build the frontend
    cmds:
      - task: lint
      - task: test
      - task: build

  run:
    desc: Build and serve the app at http://127.0.0.1:8000
    cmds:
      - task: build
      - uv run uvicorn app.app:app --host 127.0.0.1 --port 8000 --no-access-log

  dev:
    desc: Run FastAPI and Vite together at http://127.0.0.1:5173
    cmds: [task --parallel dev:api dev:web]

  dev:api:
    env:
      SPOTIFY_REDIRECT_URI: http://127.0.0.1:5173/api/auth/callback
    cmds: [uv run uvicorn app.app:app --host 127.0.0.1 --port 8000 --reload --no-access-log]

  dev:web:
    cmds: [pnpm --dir frontend dev]
